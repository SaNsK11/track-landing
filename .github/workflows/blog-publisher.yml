name: Blog Publisher

on:
  schedule:
    - cron: '30 3 * * *'   # 9:00 AM IST
    - cron: '30 13 * * *'  # 7:00 PM IST
  workflow_dispatch:        # Manual trigger from GitHub UI

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest changes
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Check API key is set
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ERROR: ANTHROPIC_API_KEY secret is missing or empty"
            exit 1
          else
            echo "ANTHROPIC_API_KEY is set (length: ${#ANTHROPIC_API_KEY})"
          fi

      - name: Generate and publish post
        run: python scripts/generate_post.py
